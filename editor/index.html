<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
  </head>

  <body>
    <script>
      // Synchronous theme bootstrap to prevent FOUC
      (function() {
        var id = null;
        try { id = localStorage.getItem('editor-theme-id'); } catch(e) {}
        var light = id === 'light-plus';
        document.documentElement.setAttribute(
          'data-theme-type',
          light ? 'light' : 'dark'
        );
        // Paint the theme's base colour before the bundle (and therefore the
        // stylesheet) has loaded. Without this the document keeps the UA
        // default white for the whole webview-startup window — on Windows,
        // where that startup is slowest, a project window would flash white
        // on the way in. Mirrors `bg-primary` in
        // features/theme/definitions/arcane-{light,dark}.ts.
        document.documentElement.style.backgroundColor = light ? '#FAF7F0' : '#13121A';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
