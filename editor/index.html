<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
  </head>

  <body>
    <script>
      // Synchronous theme bootstrap to prevent FOUC
      (function() {
        var id = null;
        try { id = localStorage.getItem('editor-theme-id'); } catch(e) {}
        document.documentElement.setAttribute(
          'data-theme-type',
          id === 'light-plus' ? 'light' : 'dark'
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
