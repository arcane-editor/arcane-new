<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
  </head>

  <body>
    <script>
      // Synchronous theme bootstrap to prevent FOUC
      (function() {
        // `type` + `bg-primary` for every theme, duplicated from
        // features/theme/definitions/*.ts because the bundle — and with it the
        // theme registry — has not loaded yet. Safe to duplicate: the values
        // are overwritten by `applyCssVariables` the moment the real theme is
        // applied, so drift here costs at most a brief wrong-coloured flash,
        // never a wrong final paint. Key must stay in sync with STORAGE_KEY in
        // stores/theme.ts.
        var THEMES = {
          'arcane-dark':  ['dark',  '#16151F'],
          'arcane-light': ['light', '#FAF7F0'],
          'dark-plus':    ['dark',  '#1e1e1e'],
          'light-plus':   ['light', '#ffffff'],
          'dracula':      ['dark',  '#282a36'],
          'monokai':      ['dark',  '#272822']
        };
        var id = null;
        try { id = localStorage.getItem('editor-theme-id-v2'); } catch(e) {}
        var theme = THEMES[id] || THEMES['arcane-dark'];
        document.documentElement.setAttribute('data-theme-type', theme[0]);
        // Paint the theme's base colour before the bundle (and therefore the
        // stylesheet) has loaded. Without this the document keeps the UA
        // default white for the whole webview-startup window — on Windows,
        // where that startup is slowest, a project window would flash white
        // on the way in.
        document.documentElement.style.backgroundColor = theme[1];
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
