[package]
name = "editor"
version = "0.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
# Deep-link URL parsing. `on_open_url` already hands us `url::Url`, so this is
# the type we have to speak anyway; it was already resolved at this version
# transitively (via the deep-link plugin), so naming it adds no resolution.
url = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "net"] }
portable-pty = "0.9"
libc = "0.2"
dirs = "6"
regex = "1"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
notify = { version = "7", features = ["macos_fsevent"] }
nucleo-matcher = "0.3"
sha1 = "0.10"
# Unpacking the bundled csharp-ls tool package. A nupkg is a plain zip, and
# unzipping it ourselves is what removes NuGet — and NuGet's inability to read
# the Windows `\\?\` resource path — from the C# provisioning path entirely.
# Already resolved at this version transitively, so naming it adds nothing to
# the build; same reasoning as the `png` and `url` entries.
# `default-features = false` deliberately: the defaults drag in the AES /
# zeroize stack for encrypted archives, which a nupkg never uses and which
# does not even resolve here. Deflate is the only codec in play.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-clipboard-manager = "2.3.2"
# Terminal image paste. The clipboard hands back raw RGBA, not an encoded
# image, and a terminal can only carry a file path — so the RGBA has to be
# encoded to a PNG on disk somewhere. Doing it here rather than in the webview
# keeps ~8MB of pixels (a full-screen screenshot) off the IPC. `png` was
# already resolved transitively at this version, so this adds no new
# resolution — same reasoning as the objc2 block below.
png = "0.17"

# macOS-only: objc2 shim for the dock right-click menu ("New Window"). tao's
# NSApplication delegate does not implement `applicationDockMenu:`, and neither
# tauri 2.10 / tao 0.34 / muda 0.17 expose a dock-menu API, so we add the
# selector to the running delegate class at startup (see src/dock.rs). These
# crates are already transitive deps (via tao); versions match Cargo.lock
# (objc2 0.6.4, objc2-app-kit/objc2-foundation 0.3.2) so no new resolution.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
tempfile = "3"

