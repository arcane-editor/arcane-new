[package]
name = "editor"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "net"] }
portable-pty = "0.9"
libc = "0.2"
dirs = "6"
regex = "1"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
notify = { version = "7", features = ["macos_fsevent"] }
nucleo-matcher = "0.3"
sha1 = "0.10"

# macOS-only: objc2 shim for the dock right-click menu ("New Window"). tao's
# NSApplication delegate does not implement `applicationDockMenu:`, and neither
# tauri 2.10 / tao 0.34 / muda 0.17 expose a dock-menu API, so we add the
# selector to the running delegate class at startup (see src/dock.rs). These
# crates are already transitive deps (via tao); versions match Cargo.lock
# (objc2 0.6.4, objc2-app-kit/objc2-foundation 0.3.2) so no new resolution.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
tempfile = "3"

