name: Release

# Builds the UnityIDE editor for macOS (Apple Silicon) and Windows x64,
# then uploads the installers to the `arcane-releases` R2 bucket.
#
# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`)
# or manually via the "Run workflow" button (workflow_dispatch).
#
# Signing: macOS is ad-hoc signed (tauri.conf.json signingIdentity "-") and
# Windows is unsigned. No signing secrets are required. Only two repo secrets
# are needed for the upload step:
#   - CLOUDFLARE_API_TOKEN  (token with R2 edit permission)
#   - CLOUDFLARE_ACCOUNT_ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            triple: aarch64-apple-darwin
            # `app` as well as `dmg`: the DMG is what people download, but it is
            # NOT an updater-enabled target, so building dmg alone produced
            # "the bundler was configured to create updater artifacts but no
            # updater-enabled targets were built" and no .app.tar.gz at all.
            bundles: app,dmg
            asset: UnityIDE-arm64.dmg
            glob: editor/src-tauri/target/release/bundle/dmg/*.dmg
            platform_key: darwin-aarch64
            updater_asset: UnityIDE.app.tar.gz
            updater_glob: editor/src-tauri/target/release/bundle/macos/*.app.tar.gz
          # macOS Intel (macos-13 / x86_64-apple-darwin / UnityIDE-x64.dmg)
          # dropped from distribution as of v0.2.0 — the download option is
          # gone from the landing page too. Restore a matrix entry here if
          # Intel support returns.
          - os: windows-latest    # Windows x64
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            asset: UnityIDESetup.exe
            glob: editor/src-tauri/target/release/bundle/nsis/*-setup.exe
            # On Windows the updater artifact IS the installer — the same file,
            # with a .sig written beside it.
            platform_key: windows-x86_64
            updater_asset: UnityIDESetup.exe
            updater_glob: editor/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # bash on Windows too, so the `CI=` env-prefix works everywhere
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with package.json publishes a manifest claiming a
      # version the binary does not report. Clients would update, still report
      # the old version, and update again — every six hours, forever. Fail here
      # instead.
      - name: Assert the tag matches editor/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./editor/package.json').version")
          if [[ "$TAG" != "$PKG" ]]; then
            echo "tag $GITHUB_REF_NAME does not match editor/package.json version $PKG" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      # Pin OFFICIAL Node (static libuv). Without this the macOS runners use
      # homebrew's node@22 (shared libuv), which crashes native build addons
      # (esbuild/Rollup/Tailwind oxide) during `vite build` — Abort trap: 6 / exit 134.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # unityide-graph sidecar (PyInstaller — native per runner). Mirrors the proven
      # steps from editor/.github/workflows/build-graph-sidecar.yml.
      - name: Build unityide-graph sidecar
        run: |
          cd editor/tooling/unityide-graph-sidecar
          python -m venv .venv
          # Call the venv's python directly instead of `activate` — works the same
          # on every OS, and `python -m pip` upgrades pip on Windows (the bare
          # `pip install --upgrade pip` can't replace its own running pip.exe).
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install graphifyy pyinstaller
          "$PY" -m PyInstaller pyinstaller.spec
          mkdir -p ../../src-tauri/binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/unityide-graph.exe "../../src-tauri/binaries/unityide-graph-${{ matrix.triple }}.exe"
          else
            cp dist/unityide-graph "../../src-tauri/binaries/unityide-graph-${{ matrix.triple }}"
          fi

      - name: Install JS deps
        run: cd editor && bun install

      # GOTCHA: build-lsp-sidecars.ts treats CI=true as "--all-targets" and would
      # cross-build all 4 platforms. Clear CI for this one step to stay host-only.
      - name: Build typescript-language-server sidecar (host only)
        run: cd editor && CI= bun run build:lsp-sidecars

      # Use the tauri BINARY (`bunx tauri`), NOT `bun run tauri` — the npm script
      # re-runs build-lsp-sidecars under CI=true (all targets). The frontend build
      # is handled by tauri's beforeBuildCommand. ad-hoc mac / unsigned Windows
      # are the defaults, so no INSTALLER signing config is needed here — but the
      # UPDATER artifacts are signed, see below.
      - name: Build Tauri app
        env:
          # Monaco makes vite's build memory-heavy; give V8 headroom so it doesn't
          # abort on the smaller (~7 GB) Apple-Silicon runner. Propagates into the
          # `vite build` that tauri runs via beforeBuildCommand.
          NODE_OPTIONS: --max-old-space-size=4096
          # `createUpdaterArtifacts` is on, so tauri signs the update bundle with
          # this key and every client verifies it against the `pubkey` baked into
          # tauri.conf.json. The two are one keypair and must stay that way: an
          # install whose update feed it cannot verify can never auto-update, and
          # there is no remote fix once it is on someone's machine. That is what
          # `check:version` guards by rejecting a placeholder pubkey — and this
          # env block is the half that was missing when it was first turned on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd editor && bunx tauri build --bundles ${{ matrix.bundles }}

      - name: Stage installer and updater artifact
        run: |
          mkdir -p dist-release
          cp "$(ls ${{ matrix.glob }} | head -n1)" "dist-release/${{ matrix.asset }}"
          UP="$(ls ${{ matrix.updater_glob }} | head -n1)"
          cp "$UP"      "dist-release/${{ matrix.updater_asset }}"
          cp "$UP.sig"  "dist-release/${{ matrix.updater_asset }}.sig"

      - name: Write the update manifest
        run: |
          V="${GITHUB_REF_NAME:-dev}"
          node editor/scripts/write-update-manifest.mjs \
            --platform "${{ matrix.platform_key }}" \
            --version  "${V#v}" \
            --url      "https://releases.unityide.app/$V/${{ matrix.updater_asset }}" \
            --sig      "dist-release/${{ matrix.updater_asset }}.sig" \
            --out      "dist-release/${{ matrix.platform_key }}.json"

      # Keep a copy as a workflow artifact too (handy for manual download / debugging).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-release/${{ matrix.asset }}

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          V="${GITHUB_REF_NAME:-dev}"
          bunx wrangler r2 object put "arcane-releases/$V/${{ matrix.asset }}"     --file "dist-release/${{ matrix.asset }}" --remote
          bunx wrangler r2 object put "arcane-releases/latest/${{ matrix.asset }}" --file "dist-release/${{ matrix.asset }}" --remote
          bunx wrangler r2 object put "arcane-releases/$V/${{ matrix.updater_asset }}" --file "dist-release/${{ matrix.updater_asset }}" --remote
          # The manifest is the one object that must never be served stale — it
          # is how a rollback reaches clients. Short TTL, JSON content type.
          bunx wrangler r2 object put "arcane-releases/latest/${{ matrix.platform_key }}.json" \
            --file "dist-release/${{ matrix.platform_key }}.json" --remote \
            --content-type application/json --cache-control "max-age=300"

  # Publishes the Unity UPM package (arcane-extension) to the same arcane-releases
  # bucket under unity-extension-releases/. Versioned by the extension's OWN
  # package.json version (independent of the app tag), plus a stable latest/ copy
  # the landing page points at — mirroring the editor's <version> + latest scheme.
  # Cheap (no native build), runs alongside the app build on every tag / dispatch.
  unity-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # deploy.sh validates package structure + .meta files, then `npm pack`s
      # the tarball (com.unityide.editor-<version>.tgz). The release channel is
      # the default and is what the checked-in source already is; the dev
      # variant is built by dev-build.yml.
      - name: Build UPM tarball
        run: cd arcane-extension && bash deploy.sh release

      - name: Upload Unity extension to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd arcane-extension
          # Both the package id and the version come from package.json, which is
          # also what `npm pack` names the tarball after. Hardcoding the id here
          # meant the rename could rename the package and still upload under the
          # old key — or, worse, upload nothing and fail on a missing file.
          V=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TGZ="${NAME}-${V}.tgz"
          test -f "$TGZ" || { echo "::error::expected $TGZ from deploy.sh, not found"; exit 1; }
          bunx wrangler r2 object put "arcane-releases/unity-extension-releases/${TGZ}"                --file "$TGZ" --remote
          bunx wrangler r2 object put "arcane-releases/unity-extension-releases/latest/${NAME}.tgz"    --file "$TGZ" --remote

  # Rebuild unityide.app against the release that just landed. The landing page
  # reads the update manifests during `astro build`, so its download cards are
  # only as fresh as its last deploy — without this the site kept advertising
  # the previous version until someone remembered to dispatch Deploy Landing.
  # `needs` both build jobs so it runs after latest/ actually holds the new
  # installers and manifests, never against a half-published release.
  deploy-landing:
    needs: [build, unity-extension]
    uses: ./.github/workflows/deploy-landing.yml
    with:
      environment: production
    secrets: inherit
