name: CI

# The editor app had NO test job at all. release.yml and dev-build.yml build on
# windows-latest but never run a test, so `bun run verify` had only ever run on
# one developer's Mac, by hand — and nothing had ever verified a single line of
# Windows behaviour. That is how a hard-coded `Err("Windows PTY writer not
# implemented")` shipped: the terminal simply could not open on the platform
# most Unity developers use.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # bash on Windows too, so one set of steps works everywhere
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Pin OFFICIAL Node (static libuv) — homebrew node crashes native addons.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri

      - name: Install JS deps
        run: cd editor && bun install --frozen-lockfile

      - name: Typecheck
        run: cd editor && bunx tsc --noEmit

      - name: Module boundaries
        run: cd editor && bun run check:modules

      - name: Invoke arguments
        run: cd editor && bun run check:invoke

      # `bun run verify` has run this locally since it was written; CI never
      # did. That gap let a half-landed change through: the guard that fails on
      # a channel publishing no update manifest was merged to `dev` while the
      # workflow fix it guards was left uncommitted, and CI stayed green because
      # nothing here ever invoked it. The JS-test step below does exercise
      # version-sync.test.ts, but against FIXTURES — this is the step that reads
      # the real configs and the real workflows.
      - name: Version and updater configuration
        run: cd editor && bun run check:version

      - name: JS tests
        run: cd editor && bun test src scripts

      # Separate step, mirroring `bun run verify`'s own ordering (JS tests,
      # THEN test:isolated, THEN Rust tests): these are deliberately excluded
      # from `bun test src scripts` above (see e.g. search-tab-lifecycle.exec.ts
      # and search-invalidation.exec.ts's file headers) because `mock.module`
      # mutates Bun's module registry for the rest of whatever process runs
      # it, so each needs its own process. Without this step CI had zero
      # coverage of search:// tab lifecycle and cross-session search
      # invalidation — the exact behaviour a green `bun test src` gave no
      # signal on.
      - name: JS tests (isolated processes)
        run: cd editor && bun run test:isolated

      # `editor/unity-bridge/` is a gitignored staging copy of `arcane-extension/`,
      # and tauri.conf.json declares it as a bundled resource — so the Tauri build
      # script aborts with "resource path `../unity-bridge` doesn't exist" when it
      # is missing. `tauri dev`/`tauri build` create it via beforeDevCommand/
      # beforeBuildCommand, but `cargo test` invokes the build script directly and
      # never triggers those hooks. It only ever passed locally because an earlier
      # build had left the folder behind; a clean checkout has never had it.
      - name: Stage the Unity bridge resource (cargo does not run Tauri's hooks)
        run: cd editor && bun run sync:bridge

      # verify:intellisense is deliberately NOT run here. It needs a real Unity
      # install, and its skip semantics (UNITYIDE_INTELLISENSE_E2E=required) make
      # a CI skip indistinguishable from a pass — which is precisely the failure
      # mode editor/CLAUDE.md documents. It stays a local gate via
      # `bun run verify`. Do NOT "fix" this by adding it with a quiet skip.
      - name: Rust tests
        run: cd editor/src-tauri && cargo test --lib
