name: Dev Build

# Builds the side-by-side "UnityIDE Dev" app (identifier com.inno.editor.dev,
# scheme unityide-dev://, config dir ~/.unityide-dev) with the DEV API/web URLs
# baked in, and uploads installers AND signed update manifests to
# arcane-releases under dev/.
#
# Mirrors release.yml step-for-step — keep the two in sync. Same two repo
# secrets (CLOUDFLARE_API_TOKEN with R2 edit, CLOUDFLARE_ACCOUNT_ID).
on:
  push:
    branches: ['dev']
    paths: ['editor/**', '.github/workflows/dev-build.yml']
  workflow_dispatch:

# One build per ref at a time; a newer push cancels the older in-flight build
# so a stale run can never overwrite dev/latest/ last (and saves runner time).
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            triple: aarch64-apple-darwin
            # `app` as well as `dmg`: dmg is NOT an updater-enabled target, and
            # building it alone logs "no updater-enabled targets were built"
            # and produces no .app.tar.gz — while the job still succeeds.
            bundles: app,dmg
            asset: UnityIDE-Dev-arm64.dmg
            glob: editor/src-tauri/target/release/bundle/dmg/*.dmg
            platform_key: darwin-aarch64
            # No space in the published name: it ends up in the manifest url.
            # The bundle itself is "UnityIDE Dev.app.tar.gz" — the signature
            # covers bytes, not the filename, so renaming is safe.
            updater_asset: UnityIDE-Dev.app.tar.gz
            updater_glob: editor/src-tauri/target/release/bundle/macos/*.app.tar.gz
          - os: windows-latest    # Windows x64
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            asset: UnityIDEDevSetup.exe
            glob: editor/src-tauri/target/release/bundle/nsis/*-setup.exe
            # On Windows the updater artifact IS the installer — the same file,
            # with a .sig written beside it.
            platform_key: windows-x86_64
            updater_asset: UnityIDEDevSetup.exe
            updater_glob: editor/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # bash on Windows too, so the `CI=` env-prefix works everywhere
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Pin OFFICIAL Node (static libuv) — homebrew node crashes native addons.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build unityide-graph sidecar
        run: |
          cd editor/tooling/unityide-graph-sidecar
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install graphifyy pyinstaller
          "$PY" -m PyInstaller pyinstaller.spec
          mkdir -p ../../src-tauri/binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/unityide-graph.exe "../../src-tauri/binaries/unityide-graph-${{ matrix.triple }}.exe"
          else
            cp dist/unityide-graph "../../src-tauri/binaries/unityide-graph-${{ matrix.triple }}"
          fi

      - name: Install JS deps
        run: cd editor && bun install

      # GOTCHA: CI=true would cross-build all 4 LSP targets. Host-only here.
      - name: Build typescript-language-server sidecar (host only)
        run: cd editor && CI= bun run build:lsp-sidecars

      # `bunx tauri` (binary), NOT `bun run tauri`. Shell env beats
      # .env.production in Vite, so the dev URLs win at build time.
      - name: Build Tauri app (dev config)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: https://api-dev.unityide.app
          VITE_WEB_URL: https://dev.unityide.app
        run: cd editor && bunx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.dev.conf.json

      - name: Stage installer and updater artifact
        run: |
          mkdir -p dist-release
          cp "$(ls ${{ matrix.glob }} | head -n1)" "dist-release/${{ matrix.asset }}"
          UP="$(ls ${{ matrix.updater_glob }} | head -n1)"
          cp "$UP"      "dist-release/${{ matrix.updater_asset }}"
          cp "$UP.sig"  "dist-release/${{ matrix.updater_asset }}.sig"

      # The dev channel has no tag to take a version from, so it reads the one
      # the binary actually reports — package.json, which tauri.dev.conf.json
      # inherits via the base config's "version": "../package.json".
      #
      # CONSEQUENCE, deliberate: every dev build between two version bumps
      # reports the SAME version, and the updater does not offer 0.3.3 to a
      # machine already on 0.3.3. Dev auto-update therefore carries version
      # bumps, not every merge to `dev`. Encoding a per-build version instead
      # would leak a build number into the UI, the ACP clientInfo handshake and
      # every crash report, to make `dev` update more often than it is versioned.
      - name: Write the update manifest
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          V="$(node -p "require('./editor/package.json').version")"
          # The url must be the immutable dev/$SHA7 copy, never dev/latest —
          # write-update-manifest.mjs refuses /latest/ outright, because a
          # download in flight would otherwise be swapped by the next build and
          # the client would verify this signature against different bytes.
          node editor/scripts/write-update-manifest.mjs \
            --platform "${{ matrix.platform_key }}" \
            --version  "$V" \
            --url      "https://releases.unityide.app/dev/$SHA7/${{ matrix.updater_asset }}" \
            --sig      "dist-release/${{ matrix.updater_asset }}.sig" \
            --out      "dist-release/${{ matrix.platform_key }}.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-release/${{ matrix.asset }}

      - name: Upload to R2 (dev channel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          bunx wrangler r2 object put "arcane-releases/dev/$SHA7/${{ matrix.asset }}"  --file "dist-release/${{ matrix.asset }}" --remote
          bunx wrangler r2 object put "arcane-releases/dev/latest/${{ matrix.asset }}" --file "dist-release/${{ matrix.asset }}" --remote
          # Only under $SHA7 — this is the object the manifest names, and it has
          # to stay exactly the bytes that signature was made over.
          bunx wrangler r2 object put "arcane-releases/dev/$SHA7/${{ matrix.updater_asset }}" --file "dist-release/${{ matrix.updater_asset }}" --remote
          # The manifest is the one object that must never be served stale — it
          # is how a rollback reaches clients. Short TTL, JSON content type.
          bunx wrangler r2 object put "arcane-releases/dev/latest/${{ matrix.platform_key }}.json" \
            --file "dist-release/${{ matrix.platform_key }}.json" --remote \
            --content-type application/json --cache-control "max-age=300"

  # The dev-channel Unity package. Published alongside the dev app because the
  # two are one unit: the package generated for this channel targets the
  # "UnityIDE Dev" application, its unityide-dev:// scheme and its
  # ~/.unityide-dev config home, and pairing it with a release app (or the
  # release package with this app) is exactly the mix-up the split exists to
  # prevent.
  #
  # Cheap (no native build), so it runs alongside the app matrix rather than
  # after it.
  unity-extension-dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # Stages a copy, rewrites it into the dev channel
      # (scripts/unity-extension-channel.mjs), validates and packs it. The
      # checked-in source is never modified.
      - name: Build dev UPM tarball
        run: cd arcane-extension && bash deploy.sh dev

      - name: Upload Unity extension to R2 (dev channel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd arcane-extension
          # Both the id and the version come from the GENERATED package.json,
          # which is also what npm pack names the tarball after — so the dev id
          # can never be uploaded under the release key.
          TGZ=$(ls com.unityide.editor.dev-*.tgz | head -n1)
          test -f "$TGZ" || { echo "::error::expected a dev tarball from deploy.sh, not found"; exit 1; }
          SHA7="${GITHUB_SHA:0:7}"
          bunx wrangler r2 object put "arcane-releases/unity-extension-releases/dev/$SHA7/${TGZ}"                    --file "$TGZ" --remote
          bunx wrangler r2 object put "arcane-releases/unity-extension-releases/dev/latest/com.unityide.editor.dev.tgz" --file "$TGZ" --remote
