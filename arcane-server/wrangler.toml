name = "arcane-server"
main = "index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Prod custom domain, adopted from the dashboard mapping. The first deploy
# with this block must be run MANUALLY (not from CI) — see the Phase 1 plan
# Task 5 — in case wrangler asks to confirm adopting the existing domain.
routes = [
  { pattern = "api.unityide.app", custom_domain = true }
]

[[d1_databases]]
binding = "arcane_db"
database_name = "arcane-db"
database_id = "fdc0556c-e622-44db-a189-1be9a55acb80"

# Cloudflare Workers AI — all LLM calls route through this binding.
[ai]
binding = "AI"

# Vectorize — version-accurate Unity documentation index (ScriptReference +
# Manual + API signatures), embedded with @cf/baai/bge-small-en-v1.5 (384-dim).
# Create the index out-of-band before deploying:
#   wrangler vectorize create unity-docs-v1 --dimensions=384 --metric=cosine
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name unityVersion  --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name docType        --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name renderPipeline --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name inputSystem    --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name deprecated     --type string
[[vectorize]]
binding = "VECTORIZE"
index_name = "unity-docs-v1"

[vars]
ENVIRONMENT = "production"
# AI Gateway id — when set, all Workers AI calls route through it for
# caching/logging/rate-limits. Requests sent via the Workers AI `binding` (as
# opposed to the public REST endpoint) are pre-authenticated within the
# account, so an *authenticated* gateway works fine from here — the
# `cf-aig-authorization` header is only required for the public REST endpoint.
# See: ai-gateway/configuration/authentication ("Expected behavior").
# Empty string = no gateway (models still work, just without caching/logging).
CF_AI_GATEWAY_ID = "arcane-ai-gateway"
# Base URL of Spark's OpenAI-compatible endpoint (MODEL_CATALOG route:'direct'
# — called directly with the owner's own key, no CF AI Gateway in this path).
# Empty = spark/* models fail loud via LlmConfigError (llm-router.ts), not a
# silent fallback. SPARK_API_KEY is a secret, set via `wrangler secret put`.
SPARK_BASE_URL = "https://api.meta.ai/v1"
# Base URL of the user-facing website (auth pages live there). Phase 2 uses
# this for the device-flow verification_uri and email links.
WEB_BASE_URL = "https://unityide.app"
# This worker's own public base URL — used as the OAuth redirect_uri host
# (Google + GitHub) and anywhere the server must name itself. GitHub allows a
# single callback URL per OAuth App, so prod and dev need one App each,
# registered against their own API_BASE_URL.
API_BASE_URL = "https://api.unityide.app"
# Verified sender on the onboarded unityide.app Email Service domain.
#
# DEPLOY GATE: unityide.app must be onboarded in Cloudflare Email Sending with
# MX/SPF on cf-bounce, DKIM on cf-bounce._domainkey and DMARC on _dmarc all
# showing verified BEFORE this value ships. Email Service refuses to send from
# an unverified domain, and sendEmail() (src/lib/email.ts) catches every throw
# and returns normally — it runs inside waitUntil and must not fail the request.
# So the failure mode is silent and total: signup returns 200, the code never
# arrives, and requireVerifiedEmail() then locks that account out of every AI
# route with nothing visible anywhere. Verify with a real signup on dev before
# promoting to prod; a green dashboard tick is not the check.
EMAIL_FROM = "no-reply@unityide.app"
# Dodo Payments LIVE product ids (per tier / top-up pack), provisioned
# 2026-08-22 (old Pro/Pro+/Ultra + credit packs archived). Secrets
# DODO_API_KEY + DODO_WEBHOOK_SECRET are set via `wrangler secret put`.
DODO_PRODUCT_STARTER = "pdt_0NlwPDYbUz00JROS1Et0L"
DODO_PRODUCT_PRO = "pdt_0NlwPDacvAVEMYd4bvzFU"
DODO_PRODUCT_MAX = "pdt_0NlwPDbltsef7FkTyLMzJ"
DODO_PRODUCT_TOPUP_16 = "pdt_0NlwPDdr7WL5ONR4Y5qRm"
DODO_PRODUCT_TOPUP_75 = "pdt_0NlwPDfBR7ti2u1BdgqVU"

[observability]
enabled = true
head_sampling_rate = 1

# Email Service send binding (domain unityide.app already onboarded:
# SPF/DKIM/DMARC live). env.EMAIL.send({to, from, subject, html, text}).
[[send_email]]
name = "EMAIL"

# Workers rate limiting (GA binding — per-colo counters, cheap, no D1).
# namespace_id is an account-unique integer-as-string per limiter; period must
# be 10 or 60. .limit({key}) → {success}. (The pre-GA [[unsafe.bindings]]
# type="ratelimit" form did NOT enforce live — see git history.)
[[ratelimits]]
name = "RL_AUTH_STRICT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AUTH_POLL"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_INLINE"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# ── dev environment ─────────────────────────────────────────────────────────
# Deploy: wrangler deploy --env dev   (worker: arcane-server-dev)
# NOTE: bindings/vars are NOT inherited into named envs — the full set is
# repeated below. `routes` IS inherited, so it MUST be overridden here or a
# dev deploy would claim api.unityide.app.
[env.dev]
name = "arcane-server-dev"
routes = [
  { pattern = "api-dev.unityide.app", custom_domain = true }
]

[[env.dev.d1_databases]]
binding = "arcane_db"
database_name = "arcane-db-dev"
database_id = "c58504c1-dbb6-44d9-80c3-313f81b79abb"

[env.dev.ai]
binding = "AI"

# SHARED with prod — the Unity docs corpus is read-only at runtime; a second
# index would need a full re-ingest for no isolation benefit.
[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "unity-docs-v1"

[env.dev.vars]
ENVIRONMENT = "development"
CF_AI_GATEWAY_ID = "arcane-ai-gateway-dev"
# See the prod [vars] comment above — full duplicate, named envs don't inherit.
SPARK_BASE_URL = "https://api.meta.ai/v1"
WEB_BASE_URL = "https://dev.unityide.app"
API_BASE_URL = "https://api-dev.unityide.app"
EMAIL_FROM = "no-reply@unityide.app"
# Dodo product ids are deliberately ABSENT from this block: on dev they are
# SECRETS on the worker (`wrangler secret put DODO_PRODUCT_<SLOT> --env dev`).
# A plaintext var of the same name SHADOWS the secret at deploy time, so
# re-adding these five names here — even as "" — silently breaks checkout
# again. productId() (src/routes/billing.ts) reads them off `env` by name,
# which resolves a secret and a var identically, so no code change is needed.
#
# Dev talks to test.dodopayments.com (dodoApiBase() keys off ENVIRONMENT, which
# is "development" here). Rather than provision a second test-mode ladder, each
# new slot REUSES an existing test-mode product left over from the retired
# ladder, matched cheapest-to-most-expensive so the dev ladder stays monotonic:
#   STARTER / PRO / MAX  ← the three retired recurring products ($20/$50/$200)
#   TOPUP_16 / TOPUP_75  ← the two retired one-time packs (amounts already match)
# The two top-up amounts line up exactly; the three subscription amounts do NOT
# — a dev Starter checkout is billed the retired product's $20 while the app
# grants Starter's 387 credits. That is test-mode play money, fine for
# exercising the flow, but it means DEV CHECKOUT AMOUNTS ARE NOT A PREVIEW OF
# PROD AMOUNTS. Prod's live ids stay in [vars] above and are untouched by this.

[env.dev.observability]
enabled = true
head_sampling_rate = 1

[[env.dev.send_email]]
name = "EMAIL"

[[env.dev.ratelimits]]
name = "RL_AUTH_STRICT"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.dev.ratelimits]]
name = "RL_AUTH_POLL"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "RL_INLINE"
namespace_id = "2003"
simple = { limit = 30, period = 60 }
