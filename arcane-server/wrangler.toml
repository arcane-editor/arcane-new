name = "arcane-server"
main = "index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "arcane_db"
database_name = "arcane-db"
database_id = "fdc0556c-e622-44db-a189-1be9a55acb80"

# Cloudflare Workers AI — all LLM calls route through this binding.
[ai]
binding = "AI"

# Vectorize — version-accurate Unity documentation index (ScriptReference +
# Manual + API signatures), embedded with @cf/baai/bge-small-en-v1.5 (384-dim).
# Create the index out-of-band before deploying:
#   wrangler vectorize create unity-docs-v1 --dimensions=384 --metric=cosine
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name unityVersion  --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name docType        --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name renderPipeline --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name inputSystem    --type string
#   wrangler vectorize create-metadata-index unity-docs-v1 --property-name deprecated     --type string
[[vectorize]]
binding = "VECTORIZE"
index_name = "unity-docs-v1"

[vars]
ENVIRONMENT = "production"
# AI Gateway id — when set, all Workers AI calls route through it for
# caching/logging/rate-limits. Requests sent via the Workers AI `binding` (as
# opposed to the public REST endpoint) are pre-authenticated within the
# account, so an *authenticated* gateway works fine from here — the
# `cf-aig-authorization` header is only required for the public REST endpoint.
# See: ai-gateway/configuration/authentication ("Expected behavior").
# Empty string = no gateway (models still work, just without caching/logging).
CF_AI_GATEWAY_ID = "arcane-ai-gateway"

[observability]
enabled = true
head_sampling_rate = 1
