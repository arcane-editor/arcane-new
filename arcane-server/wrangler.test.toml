# Test-only worker config for @cloudflare/vitest-pool-workers. Mirrors
# wrangler.toml minus the bindings the pool cannot simulate locally
# (AI, Vectorize, send_email, ratelimit) — server code guards all four:
# AI/Vectorize are only touched inside route handlers the tests gate before,
# the email lib no-ops without EMAIL, and rate limiting fails open.
# JWT_SECRET is a plain var HERE ONLY (it is a secret in real envs).
name = "arcane-server-test"
main = "index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "arcane_db"
database_name = "arcane-db-test"
database_id = "arcane-db-test"

[vars]
ENVIRONMENT = "test"
CF_AI_GATEWAY_ID = ""
WEB_BASE_URL = "https://dev.unityide.app"
API_BASE_URL = "http://localhost:8787"
EMAIL_FROM = "no-reply@unityide.app"
JWT_SECRET = "test-secret"
# spark.invalid is IANA-reserved (RFC 2606) — guaranteed to never resolve, so
# a test that actually reaches streamText's real fetch never hits a live
# host. Only llm-router.test.ts's config-error/clamp tests are meant to read
# this — they use the injected `streamTextImpl` seam and never call fetch at
# all. The two PRE-EXISTING e2e tests that resolve to spark/* under the
# code-default routing (chat-metering.test.ts, tier-gate.test.ts) deliberately
# override `model_routing` to a '@cf/...' id for their spark-adjacent request
# instead of exercising the real (unmocked) fetch path here — a real fetch to
# this unresolvable DNS name, even though the request still errors correctly,
# makes Miniflare/workerd log a spurious "uncaught exception; ... internal
# error" line (a runtime/sandbox artifact, not an error-handling bug) that
# breaks pristine test output. See the comment above `CF_ONLY_ROUTING` in
# each of those two files.
SPARK_BASE_URL = "https://spark.invalid"
# Secrets in real envs; plain vars HERE ONLY, same as JWT_SECRET/DODO_WEBHOOK_SECRET above.
SPARK_API_KEY = "test-spark-key"
ADMIN_PASSWORD = "test-admin-password"
# Base64 signing key (secret in real envs) so webhook tests exercise the real
# Standard-Webhooks HMAC path. DODO_API_KEY stays unset → checkout routes 503.
DODO_WEBHOOK_SECRET = "c2VjcmV0LXRlc3Qtc2lnbmluZy1rZXk="
